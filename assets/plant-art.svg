<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1080" viewBox="0 0 1320 1080" role="img" aria-label="Industrial steam and thermal equipment illustration">
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#23323b"/><stop offset=".55" stop-color="#101e26"/><stop offset="1" stop-color="#081218"/></linearGradient>
<linearGradient id="steel" x2="0" y2="1"><stop stop-color="#748894"/><stop offset=".19" stop-color="#334b57"/><stop offset=".46" stop-color="#182b34"/><stop offset=".75" stop-color="#526776"/><stop offset="1" stop-color="#0d1a22"/></linearGradient>
